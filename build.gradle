plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.reevil'
base { archivesName = 'reevil' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "reevil" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'reevil' }
        server { property 'forge.enabledGameTestNamespaces', 'reevil'; args '--nogui' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
