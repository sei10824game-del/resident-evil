plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.reevil'
base { archivesName = 'reevil' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "reevil" { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'reevil'
            args '--username', 'Dev', '--width', '1280', '--height', '720'
            // in-game screenshots (src/main/java/com/reevil/gametest/DevShots.java): ./gradlew runClient -Preevil.autoshot=<jobs> -Preevil.shotdir=<dir> -Preevil.world=<saves/name>
            ['autoshot', 'shotdir'].each { k -> if (project.hasProperty('reevil.' + k)) property 'reevil.' + k, project.property('reevil.' + k) as String }
            if (project.hasProperty('reevil.world')) args '--quickPlaySingleplayer', project.property('reevil.world') as String
        }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'reevil' }
        server { property 'forge.enabledGameTestNamespaces', 'reevil'; args '--nogui' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

jar { exclude 'com/reevil/gametest/**' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('printCp') { doLast { println 'CP=' + sourceSets.main.compileClasspath.asPath } }
